<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Welcome to the PC Harbour, the number one website for the best PC configurations in the city! 
    Here we offer a wide range of prebuilt configurations - from the budget 1080p gaming PCs to the top of the shelf gaming and productivity rigs!
    We aim to please all of our customers with the best component choices for the best bang for buck performance you can get out of your budget!"
    />
    <meta
      name="keywords"
      content="pc, gaming pc, gaming configuration, gaming components, budget, budget pc, 1080p, 1440p, 4k"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="assets/css/style.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/responsive.css" rel="stylesheet" type="text/css" />
    <link
      href="assets/img/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
    <title>PC Harbour - The Best PC configurations!</title>
  </head>
  <body>
    <div id="header"></div>
    <section id="products-page" class="container-fluid py-4 cs-bg-goldenrod">
      <div class="row">
        <aside id="sortAndFilter" class="col-12 col-lg-3 mb-4 mb-lg-0">
          <div id="productsSidebar">

            <div class="cs-bg-white cs-text p-3 rounded">
              <h3 class="h5 mb-3">Filter products</h3>
  
              <div class="mb-3">
                <label for="searchInput" class="form-label">Search</label>
                <div class="input-group">
                  <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search products..."
                    aria-label="Search products"
                  />
                  <button
                    id="searchBtn"
                    class="btn cs-bg-goldenrod cs-text-white"
                    type="button"
                  >
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </div>
  
              <div class="mb-3">
                <label for="sortSelect" class="form-label">Sort by</label>
                <select
                  id="sortSelect"
                  class="form-select"
                  aria-label="Sort products"
                >
                  <option value="">Choose...</option>
                  <option value="alphaasc">From A to Z</option>
                  <option value="alphadesc">From Z to A</option>
                  <option value="priceasc">Price: Low to High</option>
                  <option value="pricedesc">Price: High to Low</option>
                </select>
              </div>
  
              <div class="mb-3">
                <label for="categorySelect" class="form-label">Category</label>
                <select
                  id="categorySelect"
                  class="form-select"
                  aria-label="Filter products by category"
                ></select>
              </div>
  
              <fieldset class="mb-3">
                <legend class="h6">Resolution</legend>
                <div id="resolutionFilters"></div>
              </fieldset>
            </div>
            <div id="cartBox" class="mt-4 cs-bg-white cs-text p-3 rounded">
              <h4 class="h6">Cart</h4>
              <div id="cartItems" class="mb-3">
                <p class="mb-0">Your cart is empty.</p>
              </div>
  
              <button
                id="checkoutBtn"
                class="btn cs-bg-goldenrod cs-text-white w-100"
                type="button"
              >
                Checkout
              </button>
            </div>
          </div>
        </aside>
        <div class="text-white col-12 col-lg-9">
          <div class="mb-4">
            <h2>Here you can find the best PC configurations!</h2>
            <p>Discover the perfect PC setup for your needs and budget.</p>
          </div>
          <main id="main-content"></main>
          <div class="text-center my-4"><button id="loadMoreBtn" class="btn cs-bg-white cs-text" type="button">Load more</button></div>
        </div>
      </div>
      <p id="zeroResults" class="hidden text-center text-white my-4">
        No products found matching your criteria.
      </p>
    </section>
    <div id="footer"></div>
    <div id="toastContainer" class="toast-container-custom"></div>
    <button id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>
    <script src="assets/js/scrolltotop.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
